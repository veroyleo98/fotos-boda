<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vero y Leo · Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{overflow-x:hidden}
    body{background:#EFEEEB;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}

    .hero{width:100%;line-height:0}
    .hero img{width:100%;height:auto;display:block}

    .light{
      background:#EFEEEB;
      padding:36px 24px 52px;
      text-align:center;
      min-height:55vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .light-inner{max-width:400px;width:100%}

    .lt-sub{font-family:'Montserrat',sans-serif;font-weight:300;font-size:14px;color:#666;line-height:1.7;margin-bottom:6px}
    .lt-hash{font-size:9px;font-weight:300;letter-spacing:3px;text-transform:uppercase;color:#AAA;margin-bottom:30px}

    .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .pill{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;padding:20px 8px;
      background:#fff;border:none;border-radius:18px;
      color:#222;cursor:pointer;
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:400;
      letter-spacing:1px;text-transform:uppercase;text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      transition:transform .1s;
      box-shadow:0 2px 14px rgba(0,0,0,.07);
    }
    .pill:active{transform:scale(.95)}
    .pill-ico{font-size:24px;line-height:1}

    .btn-dark{
      display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;padding:17px;margin-top:16px;
      background:#1A1A18;color:#fff;
      font-family:'Montserrat',sans-serif;font-size:10px;font-weight:500;
      letter-spacing:2.5px;text-transform:uppercase;
      border:none;border-radius:16px;cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,.15);
      transition:transform .1s;
    }
    .btn-dark:active{transform:scale(.98)}
    .btn-ghost-lt{
      display:flex;align-items:center;justify-content:center;
      width:100%;padding:14px;margin-top:10px;
      background:transparent;color:#AAA;
      font-family:'Montserrat',sans-serif;font-size:9px;font-weight:300;
      letter-spacing:2px;text-transform:uppercase;
      border:1px solid #DDD;border-radius:14px;cursor:pointer;
    }

    .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}
    .pcell{aspect-ratio:1;position:relative;background:#e5e5e5;border-radius:10px;overflow:hidden}
    .pcell img{width:100%;height:100%;object-fit:cover;display:block}
    .rm{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .addcell{aspect-ratio:1;border:1.5px dashed #CCC;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#CCC;font-size:8px;letter-spacing:1px;text-transform:uppercase}
    .addcell-plus{font-size:22px;line-height:1}
    .rev-lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px;font-weight:300}

    .pbox{background:#E8E7E4;border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .prow{display:flex;justify-content:space-between;margin-bottom:8px}
    .plbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#888}
    .pcnt{font-size:9px;color:#AAA}
    .ptrack{height:2px;background:#DDD;border-radius:2px;overflow:hidden}
    .pfill{height:100%;background:#1A1A18;width:0%;transition:width .35s;border-radius:2px}

    .ok-names{font-family:'Great Vibes',cursive;font-size:54px;color:#1A1A18;margin:12px 0 8px}
    .ok-msg{font-size:15px;font-weight:400;color:#333;line-height:1.75;margin-bottom:22px}

    .view{display:none}.view.active{display:block}
    .spind{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex-shrink:0}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* inputs ocultos */
    input[type=file]{display:none}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:12px 22px;font-size:9px;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;border-radius:10px;transition:transform .3s;z-index:9999}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>

<div class="light">
<div class="light-inner">

  <div class="view active" id="v1">
    <p class="lt-sub">Compartí tus fotos y videos<br>con nosotros</p>
    <p class="lt-hash">#bodaveroyleo</p>
    <div class="trio">
      <!-- Álbum: múltiples fotos -->
      <button class="pill" onclick="document.getElementById('fi-album').click()">
        <span class="pill-ico">🖼</span>Del álbum
      </button>
      <!-- Cámara: abre cámara nativa del celular -->
      <button class="pill" onclick="document.getElementById('fi-cam').click()">
        <span class="pill-ico">📷</span>Cámara
      </button>
      <!-- Ver fotos -->
      <a class="pill" href="https://drive.google.com/drive/folders/1QyjGJRNOJl7FL4PRYrMggbg6Kq7boAc0" target="_blank">
        <span class="pill-ico">👁</span>Ver fotos
      </a>
    </div>

    <!-- Input álbum: múltiples imágenes -->
    <input type="file" id="fi-album" accept="image/*" multiple onchange="onFiles(this.files)">
    <!-- Input cámara: abre cámara nativa directamente, una foto por vez -->
    <input type="file" id="fi-cam" accept="image/*" capture onchange="onFiles(this.files)">
  </div>

  <div class="view" id="v2">
    <p class="rev-lbl" id="rev-lbl">0 fotos</p>
    <div class="pgrid" id="pgrid"></div>
    <div class="pbox" id="prog" style="display:none">
      <div class="prow"><span class="plbl" id="plbl">Subiendo</span><span class="pcnt" id="pcnt">0/0</span></div>
      <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    </div>
    <button class="btn-dark" id="upbtn" onclick="doUpload()">Subir fotos</button>
    <button class="btn-ghost-lt" onclick="goV1()">← Volver</button>
  </div>

  <div class="view" id="v3">
    <p class="ok-msg">¡Muchas gracias!<br>Tus fotos ya están en nuestro álbum.<br>Las vamos a atesorar para siempre.</p>
    <div class="duo">
      <button class="pill" onclick="resetAll()"><span class="pill-ico">📷</span>Subir más</button>
      <a class="pill" href="https://drive.google.com/drive/folders/1QyjGJRNOJl7FL4PRYrMggbg6Kq7boAc0" target="_blank"><span class="pill-ico">👁</span>Ver fotos</a>
    </div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyJ9KebduWHk2drSnBEL1dwqPT3GKogxq4HDpHMK4HKPdRcqTKrvSk1I5TnLhTF28jg3A/exec';
  const FOLDER_ID='1QyjGJRNOJl7FL4PRYrMggbg6Kq7boAc0';
  let files=[];

  function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}

  function onFiles(fl){
    if(!fl?.length)return;
    Array.from(fl).forEach(f=>{if(f.type.startsWith('image/'))files.push(f)});
    // Reset input para poder volver a usarlo
    document.getElementById('fi-album').value='';
    document.getElementById('fi-cam').value='';
    renderGrid();show('v2');
  }

  function renderGrid(){
    const g=document.getElementById('pgrid');g.innerHTML='';
    files.forEach((f,i)=>{
      const url=URL.createObjectURL(f);
      const d=document.createElement('div');d.className='pcell';
      d.innerHTML=`<img src="${url}"><button class="rm" onclick="rmFile(${i})">✕</button>`;
      g.appendChild(d);
    });
    const a=document.createElement('div');a.className='addcell';
    a.innerHTML='<span class="addcell-plus">+</span><span>Agregar</span>';
    a.onclick=()=>document.getElementById('fi-album').click();
    g.appendChild(a);
    const n=files.length;
    document.getElementById('rev-lbl').textContent=n===1?'1 foto seleccionada':`${n} fotos seleccionadas`;
  }

  function rmFile(i){files.splice(i,1);if(!files.length){goV1();return}renderGrid()}
  function goV1(){show('v1')}

  async function doUpload(){
    if(!files.length){showToast('Elegí al menos una foto');return}
    const btn=document.getElementById('upbtn');
    btn.disabled=true;btn.innerHTML='<span class="spind"></span>&nbsp; Subiendo...';
    document.getElementById('prog').style.display='block';
    const fill=document.getElementById('pfill'),lbl=document.getElementById('plbl'),cnt=document.getElementById('pcnt');
    let done=0,total=files.length;
    for(const f of files){
      try{
        lbl.textContent=`Preparando ${done+1}...`;
        const b64=await compress(f);
        lbl.textContent=`Subiendo ${done+1}...`;
        const body=new URLSearchParams();
        body.append('base64',b64);body.append('name','foto_'+Date.now()+'.jpg');body.append('mimeType','image/jpeg');
        await fetch(SCRIPT_URL,{method:'POST',body,mode:'no-cors'});
      }catch(e){console.error(e)}
      done++;fill.style.width=Math.round(done/total*100)+'%';cnt.textContent=`${done}/${total}`;
    }
    await new Promise(r=>setTimeout(r,800));
    files=[];show('v3');
  }

  function compress(file){
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{
        const MAX=1200;let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75).split(',')[1]);
      };img.onerror=rej;img.src=url;
    });
  }

  function resetAll(){
    files=[];document.getElementById('prog').style.display='none';document.getElementById('pfill').style.width='0%';
    const btn=document.getElementById('upbtn');btn.disabled=false;btn.innerHTML='Subir fotos';show('v1');
  }
  function showToast(msg){
    const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
  }
</script>
</body>
</html>
